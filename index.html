<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArtSkin — Bringing touch back into the loop</title>
    <meta name="description" content="ArtSkin builds non-invasive sensory interfaces that bring adaptive tactile feedback to prosthetics, robotics and XR systems." />
    <meta name="theme-color" content="#070909" />
    <link rel="icon" type="image/png" href="/assets/artskin-logo.png" />
    <link rel="apple-touch-icon" href="/assets/artskin-logo.png" />
    <meta property="og:title" content="ArtSkin — Bringing touch back into the loop" />
    <meta property="og:description" content="Non-invasive sensory interfaces for prosthetics, robotics and XR." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://artskin.ai" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              brand: {
                black: '#070909',
                dark: '#0B0E0D',
                surface: '#111514',
                border: '#28302E',
                accent: '#7FFFD4',
                lime: '#D8FF66',
                white: '#F4F5EF',
              }
            },
            backgroundImage: {
              'tech-grid': 'linear-gradient(to right, #1f1f1f 1px, transparent 1px), linear-gradient(to bottom, #1f1f1f 1px, transparent 1px)',
            },
            animation: {
              'scan': 'scan 4s linear infinite',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)', opacity: 0 },
                '15%': { opacity: 0.7 },
                '85%': { opacity: 0.7 },
                '100%': { transform: 'translateY(100%)', opacity: 0 },
              }
            }
          },
        },
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      html { scroll-behavior: smooth; }
      body {
        background-color: #070909;
        color: #F4F5EF;
        font-family: 'Inter', sans-serif;
      }
      .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }
    </style>

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^2.12.7"
  }
}
</script>
</head>

  </body>
